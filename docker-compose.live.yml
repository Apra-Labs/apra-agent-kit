# docker-compose.live.yml
# Run the agent as a VM (Express + SQLite) with a real LLM.
#
# Start:
#   CLAUDE_CODE_OAUTH_TOKEN=$(claude setup-token) docker compose -f docker-compose.live.yml up -d --build
#
# Open:   http://localhost:3000/chat
# Stop:   docker compose -f docker-compose.live.yml down
name: vm-docker

services:
  vm-agent:
    build: .
    command: ["node", "host/index.mjs"]
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      NODE_ENV: "production"
      WEBHOOK_ALLOW_HTTP: "true"
      MCP_BIND_HOST: "0.0.0.0"
      PORT: "3000"
      WORKER_POOL_SIZE: "2"
      WORKER_EPHEMERAL_MAX: "2"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
