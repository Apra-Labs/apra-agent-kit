# docker-compose.azure.yml
# Run the agent on Azure Functions with Durable Functions + Azurite.
#
# Start:
#   CLAUDE_CODE_OAUTH_TOKEN=$(claude setup-token) docker compose -f docker-compose.azure.yml up -d --build
#
# Open:   http://localhost:7071/api/chat
# Stop:   docker compose -f docker-compose.azure.yml down
name: azure-docker

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --silent --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"Promise.all([10000,10001,10002].map(p=>new Promise((y,n)=>{const s=require('net').connect(p,'localhost',()=>{s.end();y()});s.on('error',n)}))).then(()=>process.exit(0),()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  azure-agent:
    build:
      context: .
      dockerfile: deploy/azure-functions/Dockerfile
    depends_on:
      azurite: { condition: service_healthy }
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      NODE_ENV: "production"
      WEBHOOK_ALLOW_HTTP: "true"
      WORKER_POOL_SIZE: "0"
      WORKER_EPHEMERAL_MAX: "2"
      # Azurite local storage (public dev key, not a secret)
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      JOBS_BACKEND: durable
      DURABLE_TASK_HUB: fleetjobs
      WEBSITE_HOSTNAME: "localhost"
      JOBS_MAX_QUEUE_SIZE: "2"
      DURABLE_POLL_MS: "500"
    ports:
      - "7071:80"
